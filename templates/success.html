<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Success</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.55)),
    linear-gradient(135deg,#00b09b,#96c93d);
    position:relative;
}

/* Animated Background Circles */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:180px;
    height:180px;
    top:10%;
    left:10%;
}

.circle:nth-child(2){
    width:250px;
    height:250px;
    bottom:5%;
    right:8%;
    animation-delay:2s;
}

.circle:nth-child(3){
    width:120px;
    height:120px;
    bottom:20%;
    left:20%;
    animation-delay:4s;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-25px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* Success Card */

.success-card{
    width:100%;
    max-width:500px;
    padding:60px 40px;
    border-radius:30px;
    text-align:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
    color:white;
    z-index:2;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:scale(0.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

/* Success Icon */

.success-icon{
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    margin-bottom:25px;
    animation:pulse 2s infinite;
}

.success-icon i{
    font-size:60px;
    color:#7CFFB2;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }

}

/* Text */

.success-card h1{
    font-size:42px;
    font-weight:bold;
    margin-bottom:15px;
}

.success-card p{
    font-size:18px;
    color:#f1f1f1;
    line-height:1.6;
}

/* Button */

.home-btn{
    margin-top:30px;
    padding:14px 38px;
    border:none;
    border-radius:50px;
    background:linear-gradient(to right,#00c6ff,#0072ff);
    color:white;
    font-size:18px;
    font-weight:bold;
    text-decoration:none;
    display:inline-block;
    transition:0.4s;
}

.home-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,198,255,0.4);
    color:white;
}

@media(max-width:576px){

    .success-card{
        margin:20px;
        padding:40px 25px;
    }

    .success-card h1{
        font-size:32px;
    }

}

</style>

</head>

<body>

<!-- Background Circles -->

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<!-- Success Card -->

<div class="success-card">

    <div class="success-icon">

        <i class="fa-solid fa-check"></i>

    </div>

    <h1>
        Success!
    </h1>

    <p>
        Your application has been submitted successfully.
        Thank you for using the Smart Enquiry &
        Application System.
    </p>

    <a href="/" class="home-btn">

        Go Home

    </a>

</div>

</body>
</html>
