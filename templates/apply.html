{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Application Form</title>

<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Custom CSS -->

<link rel="stylesheet"
href="{% static 'css/style.css' %}">

</head>

<body class="form-page">

<!-- ===== APPLICATION CARD ===== -->

<div class="application-card">

    <!-- Banner -->

    <div class="form-banner">

        <div class="logo">

            <i class="fa-solid fa-graduation-cap"></i>

        </div>

        <h1>
            Application Form
        </h1>

        <p>
            Smart Enquiry & Admission System
        </p>

    </div>

    <!-- Form Section -->

    <div class="form-section">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Full Name
                    </label>

                    <div class="icon-input">

                        {{ form.full_name }}

                        <i class="fa-solid fa-user"></i>

                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Email Address
                    </label>

                    <div class="icon-input">

                        {{ form.email }}

                        <i class="fa-solid fa-envelope"></i>

                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <div class="icon-input">

                        {{ form.phone }}

                        <i class="fa-solid fa-phone"></i>

                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Qualification
                    </label>

                    <div class="icon-input">

                        {{ form.qualification }}

                        <i class="fa-solid fa-user-graduate"></i>

                    </div>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Course
                </label>

                {{ form.course }}

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Message
                </label>

                {{ form.message }}

            </div>

            <button type="submit"
            class="submit-btn">

                Submit Application

            </button>

        </form>

    </div>

</div>

<!-- ===== CHAT SYSTEM ===== -->

<div class="chat-container">

    <div class="chat-button"
    onclick="toggleChat()">

        <i class="fa-solid fa-comments"></i>

    </div>

    <div class="chat-box"
    id="chatBox">

        <div class="chat-header">

            <h5>
                Help & Support
            </h5>

            <span onclick="toggleChat()">
                ✖
            </span>

        </div>

        <div class="chat-body">

            <div class="message bot">

                👋 Hello! How can we help you?

            </div>

            <div class="quick-buttons">

                <button onclick="sendMessage('Application Help')">

                    Application Help

                </button>

                <button onclick="sendMessage('Course Details')">

                    Course Details

                </button>

                <button onclick="sendMessage('Contact Support')">

                    Contact Support

                </button>

            </div>

            <div id="chatMessages"></div>

        </div>

    </div>

</div>

<!-- Chat JS -->

<script src="{% static 'js/chat.js' %}"></script>

</body>
</html>
